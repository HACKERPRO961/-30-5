name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Oyunu derle (oyun.html)
        run: |
          npm install --no-audit --no-fund
          node build.mjs
      - name: Android projesi
        working-directory: android-app
        run: |
          npm install --no-audit --no-fund
          mkdir -p www
          cp ../dist/oyun.html www/index.html
          npx cap add android
          python3 patch-android.py
          npx cap sync android
      - name: APK derle
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: 30-5-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
